<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>공공시설물 통합관리 솔루션 · 프로토타입</title>
  <meta name="description" content="공공시설물 통합관리 솔루션 시연용 프로토타입 (개발 중)">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #15181d;
      --muted: #5b6370;
      --line: #e3e6eb;
      --accent: #1f6feb;
      --accent-soft: #e8f0fe;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1216;
        --card: #171b21;
        --text: #eef1f5;
        --muted: #9aa3af;
        --line: #2a3038;
        --accent: #5b9bff;
        --accent-soft: #1b2a42;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 40px 32px;
    }
    .icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--accent-soft);
      display: grid;
      place-items: center;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 999px;
      padding: 4px 12px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 28px;
      line-height: 1.3;
      font-weight: 700;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    .sub {
      font-size: 17px;
      color: var(--muted);
      margin: 0 0 28px;
    }
    .notice {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
      border-top: 1px solid var(--line);
      padding-top: 20px;
      margin: 0;
    }
    footer {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      padding: 20px 16px 28px;
    }
    @media (max-width: 480px) {
      .card { padding: 32px 20px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent)">
          <path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/>
          <circle cx="12" cy="9.5" r="2.5"/>
        </svg>
      </div>
      <span class="badge">시연용 프로토타입 · 개발 중</span>
      <h1>공공시설물 통합관리 솔루션</h1>
      <p class="sub">시설물 위치 · 구성품 · 점검 이력 · QR 민원을 지도 기반으로 관리합니다.</p>
      <p class="notice">이 페이지는 내부 검토와 시연을 위한 테스트 주소입니다.<br>실제 기관 데이터는 포함되어 있지 않습니다.</p>
    </section>
  </main>
  <footer>ⓒ 슈퍼스토리</footer>
</body>
</html>
